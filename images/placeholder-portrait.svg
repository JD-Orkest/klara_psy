  />

  <!-- Visage — traits simplifiés -->
  <!-- Yeux -->
  <ellipse cx="270" cy="295" rx="12" ry="8" fill="#424845" fill-opacity="0.3"/>
  <ellipse cx="330" cy="295" rx="12" ry="8" fill="#424845" fill-opacity="0.3"/>
  <!-- Sourire -->
  <path
    d="M 275 345 Q 300 365 325 345"
    stroke="#424845"
    stroke-opacity="0.3"
    stroke-width="3"
    fill="none"
